<!DOCTYPE html>
{% load static %}

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login First</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <link rel="icon" href="{% static 'dashboard/images/favicon.ico' %}" type="image/x-icon">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inika:wght@400;700&display=swap">
    <style>
        body {
            font-family: 'Inika', sans-serif;
            background-color: #131C2D;
            color: #fff;
            display: flex;
            justify-content: center;
            height: 90vh;
            flex-direction: column;
        }

        .text {
            font-size: 25px;
            align-self: center;
            margin: 20px;
        }

        .go-back-link {
            font-size: 20px;
            align-self: center;
            margin: 20px;
            color: #A4C2FF;
            text-decoration: none;
            padding: 10px 20px;
            transition: all 0.3s ease;
            border: #131C2D 1px solid;
            border-radius: 10px;
        }

        .go-back-link:hover {
            color: #fff;
            border: #A4C2FF 1px solid;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
<div class="text">Sorry, you have to log in to access this page.</div>
<a href="{% url 'login' %}" class="text go-back-link">Go back</a>
</body>
</html>
